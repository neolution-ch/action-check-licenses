name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "release/**"
    types: [opened, reopened, synchronize, ready_for_review]

# cancel running actions for current PR if new commits were pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changeset-check:
    name: Changeset Check
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Must precede setup-node so its pnpm cache can resolve the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        if: "!startsWith(github.head_ref, 'changeset-release/')"
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prettier-check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Check changed files
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            echo "Some files changed after build:"
            echo
            git diff --cached --stat
            echo
            # dist/index.js is a single-line-heavy bundle, so show a trimmed word diff:
            # the stat alone never says WHAT differs.
            git diff --cached -U0 --word-diff=plain -- . | head -c 6000
            echo
            echo "Please rebuild it locally and commit all the files"
            exit 1
          fi

  smoke-package-managers:
    # test-action only covers the manager this repository itself uses (pnpm). Without this job a
    # broken install plan for npm, yarn classic or yarn berry would ship unnoticed, and a wrong
    # node_modules layout does not error -- it silently reports a handful of packages.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke

  test-action:
    # The action only does anything on a pull_request event, so running it elsewhere proves nothing.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately no pnpm setup step: this repository is a pnpm project, so this mirrors a
      # consuming repo that never sets pnpm up, and exercises the corepack fallback for real.
      - name: Use the license check action on this
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          continueOnBlockedFound: true
          blockedLicenses: |
            GPL
            GPL-2.0
            ISC
